[project]
name = "msai633-rag"
version = "0.1.0"
description = "Cited RAG chatbot over a Genshin Impact wiki snapshot (MSAI 633 residency)"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.15.0",
    "chainlit>=2.12.0",
    "chromadb>=1.5.9",
    "lxml>=6.1.3",
    "openai>=3.28.0",
    "pdfplumber>=0.11.10",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "torch>=2.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installed in editable mode by `uv sync`, so `import rag` works from any directory (no sys.path hacks)
[tool.hatch.build.targets.wheel]
packages = ["rag", "ingest", "evaluation", "chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# CUDA build of torch on Windows/Linux (GPU embedding + reranking); macOS falls back to the PyPI build
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
