name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    # macOS runner: pyproject uses the regular PyPI torch build on darwin (smaller than the CUDA build)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Cache Hugging Face tokenizer
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-m3
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest -q
